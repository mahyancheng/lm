# Frontier Capital — Supabase CLI configuration.
#
# Local stack:  supabase start
# Apply schema: supabase db reset   (runs migrations/ in order, then seed.sql)
#
# Hosting is Vercel (Next.js) + Supabase. There is no OpenAI/ChatGPT dependency
# anywhere in this project; all LLM roles call the Anthropic Claude API from
# server-side code that holds the service role key.

project_id = "frontier-capital"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Leaderboards and event ledgers can be long; keep a sane ceiling.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local mail catcher for auth flows.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Player identities must be persistent and account-bound: Apple's UGC rules and
# the game's connection-gating both forbid anonymous participants.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.github]
enabled = false

[analytics]
enabled = false
