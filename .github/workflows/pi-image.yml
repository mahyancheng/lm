# Builds the Raspberry Pi (linux/arm64) image on every push to the deployment
# branch and publishes it to GitHub Container Registry, so the Pi can update
# itself with `deploy/pi/update.sh` — no Mac, no tailnet access for anyone
# else, no build on the Pi (which would OOM).
#
# QEMU-emulated arm64 builds of a Next app are slow (expect 20–40 minutes) but
# free on public repositories. The Dockerfile's final gate still runs: an image
# that cannot execute the Agent SDK's arm64 binary fails here, not on the Pi.
name: pi-image

on:
  push:
    branches: [claude/opus5-agents-vercel-supabase-kz1ehf, main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'deploy/pi/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pi-image.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: pi-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build stamp is minted here, by the workflow, and never by code
      # inside the image: a timestamp taken during the build would change on
      # every rebuild of the same commit, and one taken at runtime would just
      # be the container's start time.
      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/frontier-capital" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/pi/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
          tags: |
            ${{ steps.meta.outputs.image }}:pi
            ${{ steps.meta.outputs.image }}:pi-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
